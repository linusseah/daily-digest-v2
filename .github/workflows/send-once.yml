name: Send One-Off Email

on:
  workflow_dispatch:
    inputs:
      html_file:
        description: "Path to HTML file to send"
        required: true
      subject:
        description: "Email subject"
        required: true

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - env:
          GMAIL_ADDRESS:  ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          DIGEST_TO:      ${{ secrets.DIGEST_TO }}
        run: python tools/send_email.py "${{ inputs.html_file }}" "${{ inputs.subject }}"
