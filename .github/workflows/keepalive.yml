name: Keepalive

# GitHub auto-disables scheduled workflows after 60 days without repo
# activity. This makes a trivial monthly commit so digest.yml's cron
# never gets silently switched off again.
on:
  schedule:
    - cron: "0 12 1 * *"  # 1st of every month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Touch keepalive marker
        run: date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/.keepalive

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/.keepalive
          git commit -m "chore: keepalive commit to prevent workflow auto-disable"
          git push
